# Saguna Mono: what the foundry needs to know. See partech-foundry/README.md.
name = "Saguna Mono"
version = "1.000"           # x.yyy; bump for every release
year = 2026
category = "mono"
description = "Saguna Mono is a rounded monospace for code: a light, open rhythm with soft round stroke ends and squarish rounds, and a true cursive italic with looped, handwritten forms."
charsets = ["latin", "code", "gf"]
charset_exclude = ""         # characters deliberately left out, e.g. "Ĳĳ"
sample = "fn saguna(l1: &[i32]) -> Il0O { rn != m }"
generate = "source/generate.py"
# Fully open: every style and the variable fonts under the SIL Open Font License, with no Reserved
# Font Name, so it can go to Google Fonts. The copyright names the project authors and this repo.
licence = "ofl"
repository = "https://github.com/partech-systems/font-saguna-mono"

[[family]]
name = "Saguna Mono"
static = ["Light", "Regular", "Medium", "Bold", "Light Italic", "Italic", "Medium Italic", "Bold Italic"]
variable = ["Upright", "Italic"]
